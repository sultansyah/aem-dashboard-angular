<div>
    <div class="d-flex flex-column flex-md-row align-items-start mb-4">
        <h2 class="mb-3 mb-md-0">Overview</h2>
        <div class="d-flex flex-column flex-sm-row align-items-start align-items-sm-center ml-md-auto">
            <small *ngIf="dashboardData?.lastFetchedAt" class="text-muted mb-2 mb-sm-0 mr-sm-2">
                Last cached: {{ dashboardData?.lastFetchedAt | date:'medium' }}
            </small>
            <button [class]="isLoading ? 'btn btn-secondary' : 'btn btn-primary'" type="button" [disabled]="isLoading"
                (click)="loadDashboard(true)">
                <span *ngIf="!isLoading; else loadingTpl">
                    Refresh
                </span>
                <ng-template #loadingTpl>
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="sr-only">Loading...</span>
                    </div>
                </ng-template>
            </button>
        </div>
    </div>

    <app-dashboard-skeleton *ngIf="isLoading"></app-dashboard-skeleton>

    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <div *ngIf="!isLoading && !errorMessage && dashboardData">
        <div *ngIf="dashboardData.isOfflineData" class="alert alert-warning">
            Showing offline dashboard data. Some information may be outdated.
        </div>

        <app-dashboard-charts [chartDonut]="dashboardData.chartDonut" [chartBar]="dashboardData.chartBar">
        </app-dashboard-charts>

        <app-user-list [users]="dashboardData.tableUsers"></app-user-list>
    </div>
</div>
