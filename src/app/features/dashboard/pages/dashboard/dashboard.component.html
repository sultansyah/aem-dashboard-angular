<div class="">
    <h2 class="mb-4">Overview</h2>

    <div *ngIf="isLoading" class="alert alert-info">
        Loading dashboard data...
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <div *ngIf="!isLoading && !errorMessage && dashboardData" class="row">
        <div class="col-12 col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Category Distribution</h5>
                    <app-donut-chart *ngIf="dashboardData.chartDonut"
                        [data]="dashboardData.chartDonut"></app-donut-chart>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Value Comparison</h5>
                    <app-bar-chart *ngIf="dashboardData.chartBar" [data]="dashboardData.chartBar" xLabel="Items"
                        yLabel="Amount"></app-bar-chart>
                </div>
            </div>
        </div>
    </div>

    <h2 *ngIf="!isLoading && !errorMessage && dashboardData" class="mb-4">User List</h2>
    <table *ngIf="!isLoading && !errorMessage && dashboardData?.tableUsers?.length" class="table table-bordered">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">First Name</th>
                <th scope="col">Last Name</th>
                <th scope="col">User Name</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let user of dashboardData?.tableUsers; index as i; trackBy: trackByUsername;">
                <th scope="row">{{ i+1 }}</th>
                <td>{{ user.firstName }}</td>
                <td>{{ user.lastName }}</td>
                <td>{{ user.username }}</td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="!isLoading && !errorMessage && dashboardData && !dashboardData.tableUsers.length" class="alert alert-secondary">
        No users found.
    </div>
</div>
